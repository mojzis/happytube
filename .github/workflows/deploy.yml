name: Deploy HappyTube to GitHub Pages

# The player's data is the committed stages/trusted/ + channels/ (decision 0010):
# videos.json is built here, never committed. A push to main touching them, the
# player or the code that builds the selection redeploys; the export fails the
# build if stages/trusted/ is missing.
on:
  push:
    branches: [main]
    paths:
      - "stages/trusted/**"
      - "channels/**"
      - "src/happytube/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3  # no floating major tags since v8
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Export videos to static JSON
        # From the repo root: reads stages/trusted/ and channels/
        run: uv run python -m happytube.web.export

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'src/happytube/web/static'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
