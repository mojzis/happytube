description: 'The San Diego Zoo is located near downtown San Diego in Balboa Park.
  The 100-acre Zoo is home to more than 12,000 rare and endangered animals representing
  more than 650 species and subspecies, and a prominent botanical collection with
  more than 700,000 exotic plants.


  The San Diego Zoo Safari Park is an expansive conservation park that is home to
  more than 3,600 animals representing more than 300 species. Its renowned botanical
  collection represents 3,700 species and 1.3 million plant specimens. Over half of
  the Park’s 1,800 acres have been set aside as protected native species habitat.
  It is located 30 miles north of downtown San Diego in the San Pasqual Valley near
  Escondido, California.


  The San Diego Zoo and San Diego Zoo Safari Park are operated by the international
  non-profit San Diego Zoo Wildlife Alliance. San Diego Zoo Wildlife Alliance (SDZWA)
  empowers people from around the globe to support their mission to conserve wildlife
  through innovation and partnerships.

