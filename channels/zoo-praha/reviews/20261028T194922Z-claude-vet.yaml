notes: 'This is the official Prague Zoo channel, posting short Czech clips of baby
  animals, playful gorillas, elephants and keeper commentary, which mostly suit her
  well. A few videos feature snakes, praying mantises, a lion tearing at meat or Tasmanian
  ''devils'', and these are worth skipping. The Przewalski horse transport videos
  mention the Czech Air Force but are positive conservation stories. Flags: none.
