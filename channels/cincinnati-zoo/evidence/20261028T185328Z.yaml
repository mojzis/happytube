description: 'The world-famous Cincinnati Zoo & Botanical Garden is committed to inspiring
  visitors to care about wildlife and wild places. It was voted the #1 Best Zoo and
  the #1 Best Botanical Garden by USA TODAY and has also received rave reviews from
  Child Magazine, Parents Magazine, Newsweek, and TripAdvisor. Nearly 2 million people
  visit the Zoo’s award-winning habitats and gardens annually. The Zoo, an accredited
  member of the Association of Zoos & Aquariums since 1978, is internationally known
  for its success in the protection and propagation of endangered animals and plants
  and engages in research and conservation projects worldwide. Known as the #GreenestZooInAmerica,
  the Zoo is doing its part to conserve natural resources that are critical to saving
  wildlife and habitats and is committed to greening its daily operations and reducing
  its impact on the environment with rain gardens, recycled building materials, solar
  panels and more. The Cincinnati Zoo is a 501(c)(3) nonprofit organization.'
