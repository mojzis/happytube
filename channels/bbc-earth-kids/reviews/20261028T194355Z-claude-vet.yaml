notes: 'This is the genuine BBC Earth Kids channel, but its uploads are aimed at energetic
  children. Puppy and farm-animal clips are gentle and happy, yet about half the recent
  uploads are Deadly 60 or dinosaur clips about predators, venom, hunting and tense
  danger encounters. It posts frightening content too often to approve as a whole;
  individual farm and puppy videos could be hand-picked. Flags: none. Report: vet/20261028T194355Z.md'
