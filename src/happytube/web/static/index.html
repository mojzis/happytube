<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>HappyTube</title>
    <meta name="description" content="Calm, happy videos — just watch">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="stage">
        <div class="frame"><div id="player"></div></div>
        <p id="message" class="message">Loading…</p>
    </main>

    <!-- Portrait: a quiet strip under the video. Landscape: hidden. -->
    <footer class="bar">
        <div class="now">
            <span id="title" class="title"></span>
            <span id="channel" class="channel"></span>
        </div>
        <button id="nextBtn" class="btn" type="button" aria-label="Next video">&#x23ED;</button>
        <button id="listBtn" class="btn" type="button" aria-label="All videos">&#x2630;</button>
    </footer>

    <!-- Landscape: one faint button in the corner. -->
    <button id="cornerBtn" class="corner" type="button" aria-label="All videos">&#x2630;</button>

    <dialog id="sheet" class="sheet" aria-label="All videos">
        <div class="sheet-head">
            <span>Videos</span>
            <button id="closeBtn" class="btn small" type="button" aria-label="Close">&#x2715;</button>
        </div>
        <ul id="list" class="list"></ul>
    </dialog>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="player.js"></script>
</body>
</html>
